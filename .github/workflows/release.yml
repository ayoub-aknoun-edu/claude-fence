name: release
# Pushing a tag like v0.2.2 publishes a GitHub release with the matching CHANGELOG section.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: verify the tag is releasable
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^CFENCE_VERSION="\(.*\)"/\1/p' bin/cfence)"
          [ "$ver" = "$code" ] || { echo "::error::tag is v$ver but bin/cfence says $code"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
          awk -v v="$ver" '$0 ~ "^## "v" " {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG section for $ver"; exit 1; }
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
