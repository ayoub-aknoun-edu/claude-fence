# cfence × tmux — show the active Claude profile in the status bar.
# cfence sets two pane options right before exec'ing claude: @cfence (profile) and @cfence_color
# (a stable colour per profile). They are only DISPLAYED while the pane's foreground command is
# claude, so nothing needs cleaning up when claude exits — and the window keeps its natural
# "claude" name because cfence never stays in the process tree.
#
# Paste into ~/.tmux.conf (or `source-file` it) AFTER your theme sets status-right:
set -ag status-right "#{?#{&&:#{@cfence},#{m:*claude*,#{pane_current_command}}},#[bg=#{@cfence_color}#,fg=#181926#,bold] ⬤ #{@cfence} #[default] ,}"
# Window list (optional): name windows running claude "claude:<profile>" (works with any theme, since it
# only changes the window NAME, not the theme's window-status formats). Windows you renamed by hand keep their name.
setw -g automatic-rename-format "#{?#{&&:#{@cfence},#{m:*claude*,#{pane_current_command}}},cl:#{@cfence},#{pane_current_command}}"
